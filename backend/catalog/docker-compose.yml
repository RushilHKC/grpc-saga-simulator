version: '3.8'

services:
  db:
    image: postgres:16.3
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: Harshwardhan
      POSTGRES_PASSWORD: admin
    volumes:
      - db-data:/var/lib/postgresql/data
      # - ./scripts:/docker-entrypoint-initdb.d
      - ./scripts:/db_init.sql
    ports: 
      - "5432:5432"

volumes:
  db-data: 